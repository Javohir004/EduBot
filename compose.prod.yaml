# Production stack (one VPS). See docs/deploy.md.
#   docker compose -f compose.prod.yaml up -d --build     # build images on the server
#   docker compose -f compose.prod.yaml pull && ... up -d # or use the images CI pushes to GHCR
# Secrets come from .env next to this file (template: .env.production.example). Only Caddy publishes ports.
# Own project name: never touches the containers/volumes of the local dev stack (project "edubot").
name: edubot-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edubot
      POSTGRES_USER: ${DB_USER:-edubot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d edubot"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:-edubot-backend:local}
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: ${EDUBOT_ENV_FILE:-.env}
        required: true
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/edubot
      # Behind Caddy: use X-Forwarded-* so rate limits see the real client IP.
      FORWARD_HEADERS_STRATEGY: native
      MINI_APP_URL: ${MINI_APP_URL:-https://${DOMAIN:?Set DOMAIN in .env}}
      FRONTEND_DIST_DIR: ""
      API_DOCS_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: Caddy reaches it as backend:8080, /actuator is not proxied.
    deploy:
      resources:
        limits:
          memory: 1536m
    networks: [internal]
    logging: *logging

  caddy:
    image: ${WEB_IMAGE:-edubot-web:local}
    build: ./web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  backup:
    image: ${BACKUP_IMAGE:-edubot-backup:local}
    build: ./backup
    restart: unless-stopped
    # Files in BACKUP_DIR belong to the deploy user so they can be copied off the server with scp.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: postgres
      PGDATABASE: edubot
      PGUSER: ${DB_USER:-edubot}
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?Set BACKUP_AGE_RECIPIENT (age public key) in .env}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${TZ:-Asia/Tashkent}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
