name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test (unit + Testcontainers integration tests)
        run: ./mvnw -B verify

  frontend:
    name: Frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images (pushed to GHCR on main)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Retries: the builds download base images and dependencies, which occasionally
      # fails on the network (runs with the same Dockerfile pass and fail intermittently).
      - name: Build images
        run: |
          build() {
            for attempt in 1 2 3; do
              # The source label links each GHCR package to this repository, which lets GITHUB_TOKEN write to it.
              if docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
                  -t "edubot-$1:ci" "$2"; then return 0; fi
              echo "Docker build of $1 attempt $attempt failed, retrying in 20s"
              sleep 20
            done
            return 1
          }
          build backend backend
          build web web
          build backup backup
      - name: Check production compose file
        run: |
          sed -e 's/^DB_PASSWORD=$/DB_PASSWORD=ci/' -e 's/^BACKUP_AGE_RECIPIENT=$/BACKUP_AGE_RECIPIENT=age1ci/' \
            .env.production.example > .env
          docker compose -f compose.prod.yaml config --quiet
          rm .env
      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for image in backend web backup; do
            for tag in latest "sha-${GITHUB_SHA::7}"; do
              docker tag "edubot-$image:ci" "ghcr.io/$owner/edubot-$image:$tag"
              docker push "ghcr.io/$owner/edubot-$image:$tag"
            done
          done

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
