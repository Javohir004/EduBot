# No secrets in this file: every sensitive value comes from environment variables.
spring:
  application:
    name: edubot
  config:
    # Local development: read the git-ignored .env from the repo root or the working directory.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/edubot}
    username: ${DB_USER:edubot}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

edubot:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME}
    init-data-max-age: 1h
  jwt:
    secret: ${JWT_SECRET}
    issuer: edubot
    ttl: 8h
  platform:
    admin-telegram-ids: ${PLATFORM_ADMIN_TELEGRAM_IDS:}
