# No secrets in this file: every sensitive value comes from environment variables.
spring:
  application:
    name: edubot
  config:
    # Local development: read the git-ignored .env from the repo root or the working directory.
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/edubot}
    username: ${DB_USER:edubot}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${SERVER_PORT:8080}
  # Set to 'native' behind Caddy/Nginx so rate limits see the real client IP.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

edubot:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    bot-username: ${TELEGRAM_BOT_USERNAME}
    init-data-max-age: 1h
  jwt:
    secret: ${JWT_SECRET}
    issuer: edubot
    ttl: 8h
  platform:
    admin-telegram-ids: ${PLATFORM_ADMIN_TELEGRAM_IDS:}
  bot:
    enabled: ${TELEGRAM_BOT_ENABLED:true}
  rate-limit:
    auth-per-minute: 20
    api-per-minute: 600
  scheduling:
    enabled: ${SCHEDULING_ENABLED:true}
  notifications:
    dispatch-interval: 10s
  demo:
    # Only used with the "demo" Spring profile: this Telegram user owns the demo center.
    owner-telegram-id: ${DEMO_OWNER_TELEGRAM_ID:}
  frontend:
    # Local development: absolute path of web/dist to serve the Mini App from the backend.
    dist-dir: ${FRONTEND_DIST_DIR:}
  app:
    # HTTPS URL of the Mini App (required by Telegram for web_app buttons)
    public-url: ${MINI_APP_URL:}
